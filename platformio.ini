[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    h2zero/NimBLE-Arduino @ ^1.4.2

[env:ski_left_s3]
board = esp32-s3-devkitc-1
build_flags =
    -D SKI_SIDE_LEFT

[env:ski_right_cam]
board = esp32cam
build_flags =
    -D SKI_SIDE_RIGHT